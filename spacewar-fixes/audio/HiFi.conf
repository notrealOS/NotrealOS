# Use case configuration for Nothing Phone (1)
# Speaker: MultiMedia1 -> PRI_MI2S_RX (2x TFA9873).
# Mic: WCD9385 ADC1 (main mic) -> SoundWire -> LPASS TX macro (v9.0: SMIC mux values ADC0..3)
#      -> TX_CODEC_DMA_TX_3 -> MultiMedia3 (hw:0,2). The DMA backend is fixed to 2 channels,
#      so the mic feeds two decimators (DEC0 + DEC1); with only one the capture never starts.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker & Earpiece Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Main Microphone"

	EnableSequence [
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX_DEC1 Volume' 96"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 20"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
