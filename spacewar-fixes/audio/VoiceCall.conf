# Voice call use case for Nothing Phone (1)
# Modem audio runs through the ADSP voice path (q6voice VoiceMMode1):
#   uplink:   main mic ADC1 -> TX_CODEC_DMA_TX_3 -> VoiceMMode1
#   downlink: VoiceMMode1 -> PRI_MI2S_RX -> 2x TFA9873
# q6voiced holds the VoiceMMode1 PCM open while a call is active, which starts the path.
# The mic is set up in the verb (not only in the Mic device) because PulseAudio
# does not necessarily open the source during a call.

SectionVerb {
	EnableSequence [
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='ADC1 Volume' 16"

		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"

		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value.TQ "Voice"
}

SectionDevice."Speaker" {
	Comment "Speaker & Earpiece Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Main Microphone"

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
