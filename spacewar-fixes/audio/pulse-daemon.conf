# This file replaces /etc/pulse/daemon.conf, so keep the system setting too.
flat-volumes = no

# Always run at 48 kHz: the internal speaker path (q6 DSP -> TFA9873) garbles
# ("robotic") when opened at 44.1 kHz. notarealPlayer HI-FI bypasses PulseAudio
# (direct ALSA), so it stays bit-perfect anyway. Old DAC-oriented config is in
# daemon.conf.bak-20261010.
avoid-resampling = yes
default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 44100

resample-method = soxr-vhq

# Interrupt-mode buffer for tsched=0 (see default.pa): 8 x 20 ms = 160 ms
default-fragments = 8
default-fragment-size-msec = 20
