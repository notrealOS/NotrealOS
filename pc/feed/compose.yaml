# Reddit front-end for the phone's notreal.feed app (reads its HTML over tailscale).
services:
  redlib:
    # quay.io image is stale (redlib#551); build main from source
    build:
      context: https://github.com/redlib-org/redlib.git#main
      dockerfile: Dockerfile.ubuntu
    image: redlib-local
    container_name: redlib
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8080"
    environment:
      REDLIB_ROBOTS_DISABLE_INDEXING: "on"
      REDLIB_DEFAULT_SHOW_NSFW: "off"
      REDLIB_DEFAULT_USE_HLS: "on"
      REDLIB_DEFAULT_COMMENT_SORT: "top"
